name: Compile examples
on: [push, pull_request]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:uno
          sketch-paths: |
            - examples/SerialTime
            - examples/LcdClock
          libraries: |
            - source-path: ./
            - name: LiquidCrystal
